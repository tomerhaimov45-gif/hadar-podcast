<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חמש דקות של שקט מ-ice</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: #14141c;
            --card-border: rgba(155, 77, 202, 0.2);
            --card-border-hover: rgba(155, 77, 202, 0.6);
            --accent-purple: #9b4dca;
            --accent-purple-glow: rgba(155, 77, 202, 0.4);
            --text-main: #ffffff;
            --text-muted: #9494a0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a102f 0%, var(--bg-color) 70%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo-container {
            width: 100%;
            margin-bottom: 32px;
        }

        .logo-img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 20px var(--accent-purple-glow);
            display: block;
            border: 1px solid rgba(155, 77, 202, 0.3);
        }

        .episode-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 18px;
            text-align: right;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .episode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .episode-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .download-btn {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50% !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
            outline: none;
        }

        .download-btn:hover {
            background: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple-glow);
        }

        .locked-message {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(155, 77, 202, 0.4);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .locked-message span.time-badge {
            color: #d480ff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .custom-player {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .play-btn {
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(135deg, #b060f0, var(--accent-purple));
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50% !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 4px 15px var(--accent-purple-glow);
            outline: none;
        }

        .stop-btn {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50% !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            outline: none;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .seek-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #22222f;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-purple);
            box-shadow: 0 0 8px var(--accent-purple-glow);
            cursor: pointer;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="logo.jpg" alt="חמש דקות של שקט מ-ice" class="logo-img">
        </div>

        <!-- פרק 1 -->
        <div class="episode-card" id="ep1">
            <div class="episode-header">
                <div class="episode-title">פרק 1</div>
                <a href="audio/פרק 1.mp3" download class="download-btn" id="dl-1" style="display: none;" title="הורד פרק">⬇</a>
            </div>
            <div id="locked-1" class="locked-message">
                <span>🔒 הפרק נעול</span>
                <span>נפתח בשעה <span class="time-badge">11:00</span></span>
            </div>
            <div class="custom-player" id="player-1" style="display: none;">
                <div class="player-controls">
                    <button class="play-btn" onclick="togglePlay(1)">▶</button>
                    <button class="stop-btn" onclick="resetAudio(1)" title="חזור להתחלה">⏹</button>
                </div>
                <div class="progress-container">
                    <input type="range" min="0" max="100" value="0" class="seek-slider" id="seek-1" oninput="seekAudio(1)">
                    <div class="time-info">
                        <span id="current-time-1">0:00</span>
                        <span id="duration-1">0:00</span>
                    </div>
                </div>
            </div>
            <audio id="audio-1" src="audio/פרק 1.mp3" preload="metadata"></audio>
        </div>

        <!-- פרק 2 -->
        <div class="episode-card" id="ep2">
            <div class="episode-header">
                <div class="episode-title">פרק 2</div>
                <a href="audio/פרק 2.mp3" download class="download-btn" id="dl-2" style="display: none;" title="הורד פרק">⬇</a>
            </div>
            <div id="locked-2" class="locked-message">
                <span>🔒 הפרק נעול</span>
                <span>נפתח בשעה <span class="time-badge">14:00</span></span>
            </div>
            <div class="custom-player" id="player-2" style="display: none;">
                <div class="player-controls">
                    <button class="play-btn" onclick="togglePlay(2)">▶</button>
                    <button class="stop-btn" onclick="resetAudio(2)" title="חזור להתחלה">⏹</button>
                </div>
                <div class="progress-container">
                    <input type="range" min="0" max="100" value="0" class="seek-slider" id="seek-2" oninput="seekAudio(2)">
                    <div class="time-info">
                        <span id="current-time-2">0:00</span>
                        <span id="duration-2">0:00</span>
                    </div>
                </div>
            </div>
            <audio id="audio-2" src="audio/פרק 2.mp3" preload="metadata"></audio>
        </div>

        <!-- פרק 3 -->
        <div class="episode-card" id="ep3">
            <div class="episode-header">
                <div class="episode-title">פרק 3</div>
                <a href="audio/פרק 3.mp3" download class="download-btn" id="dl-3" style="display: none;" title="הורד פרק">⬇</a>
            </div>
            <div id="locked-3" class="locked-message">
                <span>🔒 הפרק נעול</span>
                <span>נפתח בשעה <span class="time-badge">17:30</span></span>
            </div>
            <div class="custom-player" id="player-3" style="display: none;">
                <div class="player-controls">
                    <button class="play-btn" onclick="togglePlay(3)">▶</button>
                    <button class="stop-btn" onclick="resetAudio(3)" title="חזור להתחלה">⏹</button>
                </div>
                <div class="progress-container">
                    <input type="range" min="0" max="100" value="0" class="seek-slider" id="seek-3" oninput="seekAudio(3)">
                    <div class="time-info">
                        <span id="current-time-3">0:00</span>
                        <span id="duration-3">0:00</span>
                    </div>
                </div>
            </div>
            <audio id="audio-3" src="audio/פרק 3.mp3" preload="metadata"></audio>
        </div>

        <footer>
            מוקדש באהבה להדר. מזל טוב! ❤️
        </footer>
    </div>

    <script>
        // שעות הנעילה המקוריות שביקשת (11:00, 14:00, 17:30)
        const unlockTimes = {
            1: { hour: 11, minute: 0 },
            2: { hour: 14, minute: 0 },
            3: { hour: 17, minute: 30 }
        };

        function checkUnlockStatus() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeValue = currentHour * 60 + currentMinute;

            for (let i = 1; i <= 3; i++) {
                const target = unlockTimes[i];
                const targetTimeValue = target.hour * 60 + target.minute;

                // אם הגענו או עברנו את השעה, פותחים לצמיתות
                if (currentTimeValue >= targetTimeValue) {
                    localStorage.setItem(`unlocked_${i}`, 'true');
                }

                if (localStorage.getItem(`unlocked_${i}`) === 'true') {
                    document.getElementById(`locked-${i}`).style.display = 'none';
                    document.getElementById(`player-${i}`).style.display = 'flex';
                    document.getElementById(`dl-${i}`).style.display = 'flex';
                } else {
                    document.getElementById(`locked-${i}`).style.display = 'flex';
                    document.getElementById(`player-${i}`).style.display = 'none';
                    document.getElementById(`dl-${i}`).style.display = 'none';
                }
            }
        }

        checkUnlockStatus();
        setInterval(checkUnlockStatus, 10000);

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }

        for (let i = 1; i <= 3; i++) {
            const audio = document.getElementById(`audio-${i}`);
            const seekSlider = document.getElementById(`seek-${i}`);
            const currentTimeEl = document.getElementById(`current-time-${i}`);
            const durationEl = document.getElementById(`duration-${i}`);

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                if (audio.duration && !audio.seeking) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    seekSlider.value = percent;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            });

            audio.addEventListener('ended', () => {
                const playBtn = document.querySelector(`#ep${i} .play-btn`);
                if (playBtn) playBtn.textContent = '▶';
            });
        }

        function togglePlay(id) {
            const audio = document.getElementById(`audio-${id}`);
            const playBtn = document.querySelector(`#ep${id} .play-btn`);

            for (let i = 1; i <= 3; i++) {
                if (i !== id) {
                    const otherAudio = document.getElementById(`audio-${i}`);
                    const otherBtn = document.querySelector(`#ep${i} .play-btn`);
                    if (otherAudio && otherBtn) {
                        otherAudio.pause();
                        otherBtn.textContent = '▶';
                    }
                }
            }

            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }

        function resetAudio(id) {
            const audio = document.getElementById(`audio-${id}`);
            const seekSlider = document.getElementById(`seek-${id}`);
            const playBtn = document.querySelector(`#ep${id} .play-btn`);
            audio.pause();
            audio.currentTime = 0;
            seekSlider.value = 0;
            playBtn.textContent = '▶';
        }

        function seekAudio(id) {
            const audio = document.getElementById(`audio-${id}`);
            const seekSlider = document.getElementById(`seek-${id}`);
            if (audio.duration) {
                audio.currentTime = (seekSlider.value / 100) * audio.duration;
            }
        }
    </script>
</body>
</html>
